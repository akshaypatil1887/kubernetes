apiVersion: v1
kind: ReplicationController
metadata:
  name: myapp-rc
spec:
  replicas: 2
  selector:
    app: myapp
    version: 2.6.1
  template:
    metadata:
      name: myapp
      labels:
        app: myapp
        version: 2.6.1
    spec:
      containers:
        - name: myapp-container
          image: roshan233/singin01july24:1
          ports:
            - containerPort: 8080
